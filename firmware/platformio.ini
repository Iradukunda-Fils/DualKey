; SPDX-License-Identifier: MIT
; DualKey ESP32 Firmware — PlatformIO Configuration
;
; Board Target: ESP32 DevKit v1 (esp32doit-devkit-v1)
; Framework: Arduino ESP32 core
; Serial Speed: 115200 Baud 8N1
;
; Commands:
;   Build:          pio run
;   Upload:         pio run -t upload
;   Serial Monitor: pio device monitor -b 115200
;
; Reference: DOC-03-LLD (docs/03-design/low-level-design.md)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    miguelbalboa/MFRC522@^1.4.10

build_flags =
    -DSERIAL_BAUD=115200
    -DRFID_POLL_INTERVAL_MS=200
    -DDOOR_HOLD_MS=3000
    -DDENY_BUZZ_MS=1500
